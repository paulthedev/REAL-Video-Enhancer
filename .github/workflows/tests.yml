name: tests

on:
  push:
    branches: [main, v2-main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # system libs PySide6 needs to boot offscreen on the runner
      - name: Install Qt offscreen runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Run backend tests (unit + CLI + ffmpeg round-trip + synthetic-model render e2e)
        run: uv run --extra pytorch --extra onnx --extra dev pytest apps/backend/tests -q
      - name: Build dev UI modules
        run: uv run --extra pytorch --extra onnx --extra dev python build.py
      - name: Run GUI smoke test (offscreen)
        run: uv run --extra pytorch --extra onnx --extra dev pytest apps/gui/tests -q
