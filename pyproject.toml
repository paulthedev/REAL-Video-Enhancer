[project]
name = "REAL-Video-Enhancer"
version = "2.4.2"
description = "Real-time video enhancement and upscaling application"
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    # bundled so the provider upgrade manager can install GPU wheels even
    # from a frozen build (see ProviderUpgrade.py / the -m pip entry dispatch)
    "pip>=24.0",
    # bundled baseline: CPU everywhere, DirectML on Windows. Linux GPU
    # builds (CUDA/ROCm/OpenVINO) are installed at runtime by
    # ProviderUpgrade.py into the writable data dir.
    "onnxruntime>=1.20.0; sys_platform != 'win32'",
    "onnxruntime-directml>=1.20.0; sys_platform == 'win32'",
    "onnxconverter-common>=1.14.0",
    "opencv-python>=4.0.0",
    "PySide6-essentials>=6.11.2",
    "numpy>=2.5.3",
    "lief>=1.0.0",
    "psutil>=7.2.2",
    "py-cpuinfo>=9.0.0",
    "distro>=1.9.0",
    "certifi>=2026.7.22",
    "yt-dlp>=2026.8.19",
    "validators>=0.35.0",
    "packaging>=26.3",
    "pillow>=12.3.0",
    "spandrel>=0.4.2",
]

[project.optional-dependencies]
# dev-only tooling for producing new ONNX models from the PyTorch sources
# under apps/backend/pytorch and apps/backend/models. Not required at runtime.
convert = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "onnx>=1.14.0",
    "onnxsim>=0.4.0",
    "onnxscript>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["apps/backend/tests", "apps/gui/tests"]
pythonpath = [".", "apps/backend"]
addopts = "-v --tb=short"
markers = [
    "gui: boots real Qt widgets (needs PySide6; runs offscreen via QT_QPA_PLATFORM)",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
